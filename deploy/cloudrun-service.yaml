apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: docops-service
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
    spec:
      serviceAccountName: docops-runtime@PROJECT_ID.iam.gserviceaccount.com
      containers:
      - image: REGION-docker.pkg.dev/PROJECT_ID/docops/app:latest
        ports:
        - containerPort: 8080
        env:
        - name: GCP_PROJECT_ID
          value: PROJECT_ID
        resources:
          limits:
            cpu: "1"
            memory: "512Mi"
